<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>风织雨 · 界面方向预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8ebdf;color:#354e57;font:14px "Microsoft YaHei UI","Microsoft YaHei",sans-serif;height:100dvh;display:flex;flex-direction:column}header{min-height:64px;display:flex;align-items:center;gap:22px;padding:10px 22px;background:#f5f5e9;border-bottom:1px solid #354e5720;flex-wrap:wrap}header strong{font-weight:600;white-space:nowrap}header small{color:#607b80;font-weight:400;margin-left:10px}nav{display:flex;gap:4px}button,a{font:inherit;color:inherit;border:1px solid transparent;text-decoration:none;background:transparent;border-radius:5px;padding:8px 12px;cursor:pointer}button.active{background:#354e57;color:#f0f5e3}button:hover,a:hover{background:#354e5710}button.active:hover{background:#354e57}button:focus-visible,a:focus-visible{outline:2px solid #997940;outline-offset:2px}.pages{margin-left:auto;display:flex;gap:2px}.pages button{font-size:12px;padding:8px}.pages button.active{background:#dce7df;color:#354e57}main{flex:1;min-height:0;position:relative;background:#354e57}iframe{width:100%;height:100%;border:0;display:block}footer{height:30px;display:flex;align-items:center;padding:0 20px;font-size:11px;color:#607b80;background:#f5f5e9;gap:16px}footer span:last-child{margin-left:auto}@media(max-width:1050px){header{gap:8px;padding:8px 12px}header small{display:none}.pages{margin-left:auto}button{padding:7px 9px}}@media(max-width:760px){header{gap:6px}.pages{width:100%;justify-content:center}header strong{font-size:12px}footer{padding:0 10px}footer span:last-child{display:none}}
</style></head><body>
<header><strong>风织雨<small>界面方向初稿</small></strong><nav aria-label="切换设计方向"><button data-variant="a">A · 海上来风</button><button data-variant="b">B · 风过群岛</button><button data-variant="c">C · 风的手记</button></nav><div class="pages" aria-label="预览页面"><button data-page="home">主界面</button><button data-page="levels">选关</button><button data-page="help">玩法说明</button><button data-page="settings">设置</button><a href="overview.html">并排看</a></div></header>
<main><iframe title="风织雨交互界面初稿" id="demo"></iframe></main>
<footer><span id="caption"></span><a id="standalone" target="_blank" rel="noopener">独立打开</a><span>可点击体验；HTML不进行天气模拟，不读取游戏存档。</span></footer>
<script>
const names={a:'A · 海上来风：左侧竖排入口，留出开阔海面。',b:'B · 风过群岛：居中岛屿与下方横向菜单。',c:'C · 风的手记：奶油色页边与大幅地图观察窗。'};
const params=new URLSearchParams(location.search);let variant=['a','b','c'].includes(params.get('variant'))?params.get('variant'):'b';let page=['home','levels','help','settings','preview'].includes(params.get('page'))?params.get('page'):'home';const demo=document.querySelector('#demo');let loading=true;
function paint(){document.querySelector('#standalone').href=`menu-${variant}.html?page=${page}`;document.querySelectorAll('[data-variant]').forEach(b=>b.classList.toggle('active',b.dataset.variant===variant));document.querySelectorAll('button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.querySelector('#caption').textContent=names[variant];}
function setVariant(v){variant=v;loading=true;demo.src=`menu-${v}.html?page=${page}`;document.querySelector('#standalone').href=demo.src;paint();history.replaceState(null,'',`?variant=${v}&page=${page}`)}
function setPage(p){page=p;if(!loading)demo.contentWindow.postMessage({type:'wr-prototype-nav',page:p},'*');paint();history.replaceState(null,'',`?variant=${variant}&page=${page}`)}
demo.addEventListener('load',()=>{loading=false;demo.contentWindow.postMessage({type:'wr-prototype-nav',page},'*')});
addEventListener('message',e=>{if(!loading&&e.source===demo.contentWindow&&e.data?.type==='wr-prototype-state'&&['home','levels','help','settings','preview'].includes(e.data.page)){page=e.data.page;paint();history.replaceState(null,'',`?variant=${variant}&page=${page}`)}});
const fitting=document.createElement('style');fitting.textContent='main{overflow:hidden}iframe{position:absolute;width:1600px;height:900px;left:50%;top:50%;transform-origin:50% 50%;transform:translate(-50%,-50%) scale(var(--fit,1))}footer a{padding:0;font-size:11px;text-decoration:underline}';document.head.append(fitting);
new ResizeObserver(entries=>{const r=entries[0].contentRect;demo.style.setProperty('--fit',Math.min(r.width/1600,r.height/900))}).observe(document.querySelector('main'));
document.querySelectorAll('[data-variant]').forEach(b=>b.addEventListener('click',()=>setVariant(b.dataset.variant)));document.querySelectorAll('button[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));setVariant(variant);
</script></body></html>
