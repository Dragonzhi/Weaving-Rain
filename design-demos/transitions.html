<header><h1>让风，从页面之间经过。</h1><p>B · 风过群岛 / 转场交互小样</p></header>
<main><aside><p class="eyebrow">THREE MOTIONS</p><button class="variant active" data-mode="wind"><strong>01 · 风线掠过</strong><span>风线先行，柔软风幕带出下一页。<br>建议：主界面与选关 · 0.65 秒</span></button><button class="variant" data-mode="cloud"><strong>02 · 薄云聚散</strong><span>两侧云团合拢，再散开看见岛屿。<br>建议：进入／切换关卡 · 0.85 秒</span></button><button class="variant" data-mode="ripple"><strong>03 · 一圈水纹</strong><span>从操作位置展开，轻轻揭开画面。<br>建议：偏水意象的备选 · 0.65 秒</span></button><div class="advice"><strong>先看风，再看云。</strong><br>完整转场用在进入关卡、下一关等节点。设置、说明与暂停使用短淡入，保留操作的轻快感。</div><p class="keys">拖动时间轴可停在任何一帧。<br>所有图片均来自当前 Godot。<br><a href="index.html?variant=b">返回 B 界面参考 →</a></p></aside>

const contexts={menu:['home','levels'],game:['levels','game'],settings:['home','settings']};
const before=document.querySelector('#before'),after=document.querySelector('#after'),stage=document.querySelector('#stage'),canvas=document.querySelector('#effect'),ctx=canvas.getContext('2d'),seek=document.querySelector('#seek'),out=document.querySelector('#time'),reduce=document.querySelector('#reduce');
let mode='wind',context='menu',reversed=false,progress=0,raf=0,playing=false;
const names={wind:'风线掠过',cloud:'薄云聚散',ripple:'一圈水纹',light:'轻切换'};
const clamp=(n)=>Math.max(0,Math.min(1,n));
const smooth=(a,b,x)=>{const n=clamp((x-a)/(b-a));return n*n*(3-2*n)};
const ease=(n)=>n<.5?4*n*n*n:1-Math.pow(-2*n+2,3)/2;
function effective(){return context==='settings'||reduce.checked?'light':mode}
function duration(){return effective()==='light'?(reduce.checked?120:180):mode==='cloud'?850:650}
function paint(){document.querySelectorAll('button[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));document.querySelectorAll('button[data-context]').forEach(b=>b.classList.toggle('active',b.dataset.context===context));document.querySelector('#badge').textContent=(context==='settings'?'轻切换 · 三方向共用':names[effective()])+' · 实机画面';}
function prepare(){cancelAnimationFrame(raf);playing=false;let pair=contexts[context];if(reversed)pair=[...pair].reverse();before.src=photos[pair[0]];after.src=photos[pair[1]];render(0);paint();}
function wind(p,w,h){
 const cover=smooth(.13,.46,p)*(1-smooth(.54,.87,p));
 ctx.fillStyle=`rgba(240,243,230,${cover})`;ctx.fillRect(0,0,w,h);
 const center=(-.65+2.3*ease(p))*w,span=w*.78;
 const alpha=Math.sin(Math.PI*p);
 ctx.save();ctx.globalAlpha=alpha;
 const gradient=ctx.createLinearGradient(center-span,0,center+span,0);gradient.addColorStop(0,'#cce3dc00');gradient.addColorStop(.45,'#a9d5d9bb');gradient.addColorStop(.7,'#cce3dc88');gradient.addColorStop(1,'#cce3dc00');ctx.fillStyle=gradient;
 ctx.beginPath();ctx.moveTo(center-span,-h*.1);ctx.bezierCurveTo(center-span*.6,h*.3,center-span*1.1,h*.7,center-span*.5,h*1.1);ctx.lineTo(center+span,h*1.1);ctx.bezierCurveTo(center+span*.6,h*.7,center+span*1.1,h*.25,center+span*.5,-h*.1);ctx.closePath();ctx.fill();
 for(let n=0;n<13;n++){let phase=(p*1.12+n*.097)%1;let x=(-.35+phase*1.7)*w,y=h*(.08+(n*.143)% .84);ctx.strokeStyle=`rgba(255,255,247,${.72*Math.sin(Math.PI*phase)})`;ctx.lineWidth=(n%3===0?2:1.1)*w/1280;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x-w*.18,y+h*.012);ctx.bezierCurveTo(x-w*.12,y-h*.018,x-w*.04,y+h*.018,x,y);ctx.stroke()}
 ctx.restore();
}
function cloud(p,w,h){
 const cover=smooth(.16,.45,p)*(1-smooth(.55,.88,p));ctx.fillStyle=`rgba(240,243,230,${cover})`;ctx.fillRect(0,0,w,h);
 const closed=p<.5?ease(p*2):ease((1-p)*2);const alpha=smooth(0,.1,p)*(1-smooth(.9,1,p));
 ctx.save();ctx.globalAlpha=alpha;
 for(let side=0;side<2;side++){const x=(side===0?-.45+closed*.81:1.45-closed*.81)*w;
  for(let layer=1;layer>=0;layer--){ctx.fillStyle=layer?'#c4d8df':'#f0f3e6';const edge=x+(side===0?1:-1)*layer*w*.018;
   ctx.fillRect(side===0?-w:edge,-h*.3,side===0?edge+w:w*2,h*1.6);
   for(let n=0;n<8;n++){let y=h*(-.08+n*.17),offset=Math.sin(n*2.8+side)*w*.035;ctx.beginPath();ctx.ellipse(edge+offset,y+layer*h*.035,w*(.14+(n%3)*.016),h*.15,0,0,Math.PI*2);ctx.fill()}
  }
 }
 ctx.restore();
}
function ripple(p,w,h){
 const q=ease(p),x=w*.5,y=h*.8,r=Math.hypot(w*.5,h*.8)*q;

 const alpha=Math.sin(Math.PI*p);
 for(let n=0;n<2;n++){ctx.strokeStyle=n===0?`rgba(255,255,246,${alpha*.8})`:`rgba(122,174,188,${alpha*.42})`;ctx.lineWidth=(n===0?2.5:1.2)*w/1280;ctx.beginPath();ctx.arc(x,y,Math.max(0,r-n*w*.015),0,Math.PI*2);ctx.stroke()}
}
function render(p){progress=clamp(p);const w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);before.style.opacity='1';after.style.opacity='0';after.style.clipPath='none';
 const kind=effective();if(kind==='light'){after.style.opacity=String(ease(progress));before.style.opacity='1'}
 else if(kind==='ripple'){after.style.opacity='1';ripple(progress,w,h)}
 else {after.style.opacity=progress>=.5?'1':'0';if(kind==='wind')wind(progress,w,h);else cloud(progress,w,h)}
 if(progress===1){after.style.opacity='1';after.style.clipPath='none';ctx.clearRect(0,0,w,h)}

}
function play(){cancelAnimationFrame(raf);playing=true;render(0);const start=performance.now(),length=duration()*(document.querySelector('#slow').checked?2.5:1);document.querySelector('#status').textContent='正在预览：'+names[effective()]+(reversed?' · 返回':' · 进入');
 const tick=now=>{let p=clamp((now-start)/length);render(p);if(p<1)raf=requestAnimationFrame(tick);else{playing=false;document.body.dataset.playing='false';document.querySelector('#status').textContent='已结束。可以换一种动效，或拖时间轴比较中间帧。'}};raf=requestAnimationFrame(tick);
}
document.querySelectorAll('button[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;prepare();play()}));document.querySelectorAll('button[data-context]').forEach(b=>b.addEventListener('click',()=>{context=b.dataset.context;reversed=false;prepare();play()}));document.querySelector('#play').addEventListener('click',play);document.querySelector('#reverse').addEventListener('click',()=>{reversed=!reversed;prepare();play()});seek.addEventListener('input',()=>{cancelAnimationFrame(raf);playing=false;render(seek.value/1000);document.querySelector('#status').textContent='时间轴停帧 · 点击播放可重新观察完整节奏。'});reduce.addEventListener('change',()=>{prepare();play()});
reduce.checked=matchMedia('(prefers-reduced-motion:reduce)').matches;
new ResizeObserver(()=>{canvas.width=stage.clientWidth;canvas.height=stage.clientHeight;render(progress)}).observe(stage);
window.__transitionDemo={seek(p){cancelAnimationFrame(raf);playing=false;render(p)},get state(){return{mode,context,progress,playing,reversed,effective:effective(),duration:duration()}}};
